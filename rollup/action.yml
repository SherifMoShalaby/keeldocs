name: "keeldocs rollup"
description: >-
  The weekly rollup PR (ADR-012's noise SLO): applies keeldocs' deterministic
  regenerations and maintains AT MOST ONE open PR - a fixed branch name makes
  the cap structural, not procedural. Rebind/tombstone proposals are human
  decisions and are never auto-applied here. Needs contents: write and
  pull-requests: write. Schedule it weekly:

    on: { schedule: [{ cron: "0 6 * * 1" }], workflow_dispatch: {} }

branding: { icon: "refresh-cw", color: "blue" }

inputs:
  branch:
    description: "Fixed rollup branch (one branch = one PR, maximum)"
    default: "keeldocs/rollup"
  base:
    description: "PR base branch (defaults to the repository default branch)"
    default: ""
  working-directory:
    description: "Repo subdirectory to sync"
    default: "."
  dry-run:
    description: "Preview only: report what would be applied, push nothing"
    default: "false"

outputs:
  code:
    description: "Sync envelope code: APPLIED | PROPOSALS | NOTHING_TO_SYNC | TOOL_ERROR"
    value: ${{ steps.sync.outputs.code }}
  applied:
    description: "Number of regenerations applied"
    value: ${{ steps.sync.outputs.applied }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with: { node-version: 20 }
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with: { python-version: "3.12" }
    - name: Install extractor runtime (pinned)
      shell: bash
      run: pip install -q --require-hashes -r "${{ github.action_path }}/../providers/requirements.txt"
    - name: keeldocs sync --apply-all
      id: sync
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          node "${{ github.action_path }}/../bin/keeldocs.js" sync --json > kd-sync.json
        else
          node "${{ github.action_path }}/../bin/keeldocs.js" sync --apply-all --json > kd-sync.json
        fi
        rc=$?
        set -e
        cat kd-sync.json
        code=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("kd-sync.json","utf8")).code)')
        applied=$(node -e 'const e=JSON.parse(require("fs").readFileSync("kd-sync.json","utf8"));console.log((e.data.applied??[]).length)')
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "applied=$applied" >> "$GITHUB_OUTPUT"
        if [ "$rc" -ge 2 ]; then exit "$rc"; fi
    - name: Push the rollup branch (one, fixed)
      id: push
      if: ${{ inputs.dry-run != 'true' && steps.sync.outputs.applied != '0' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if git diff --quiet; then echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
        git config user.name "keeldocs-rollup"
        git config user.email "keeldocs-rollup@users.noreply.github.com"
        git checkout -B "${{ inputs.branch }}"
        git add -A ':!kd-sync.json'
        git commit -m "docs: keeldocs rollup ($(git rev-parse --short HEAD~0 2>/dev/null || echo update))" \
          -m "Deterministic regenerations applied by the scheduled rollup. One PR max by construction."
        git push -f origin "${{ inputs.branch }}"
        echo "pushed=true" >> "$GITHUB_OUTPUT"
    - name: Open or update THE rollup PR
      if: ${{ steps.push.outputs.pushed == 'true' }}
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        KD_BRANCH: ${{ inputs.branch }}
        KD_BASE: ${{ inputs.base }}
        KD_DIR: ${{ inputs.working-directory }}
      with:
        script: |
          const fs = require("fs");
          const path = require("path");
          const env = JSON.parse(fs.readFileSync(path.join(process.env.KD_DIR, "kd-sync.json"), "utf8"));
          const { owner, repo } = context.repo;
          const base = process.env.KD_BASE || (await github.rest.repos.get({ owner, repo })).data.default_branch;
          const head = process.env.KD_BRANCH;
          const title = "docs: keeldocs rollup";
          const applied = (env.data.applied ?? []).map(a => `- \`${a.id}\` (${a.action})`).join("\n");
          const body = [
            "<!-- keeldocs-rollup -->",
            "Deterministic doc regenerations from the scheduled keeldocs rollup.",
            "",
            env.summary,
            "",
            applied,
            "",
            "_One rollup PR maximum, by construction (fixed branch, force-pushed). Human-decision proposals (rebind/tombstone) are never auto-applied - review them locally with `keeldocs sync`._",
          ].join("\n");
          const open = await github.rest.pulls.list({ owner, repo, state: "open", head: `${owner}:${head}`, base });
          if (open.data.length) {
            await github.rest.pulls.update({ owner, repo, pull_number: open.data[0].number, title, body });
          } else {
            await github.rest.pulls.create({ owner, repo, head, base, title, body });
          }
