# keeldocs, running on keeldocs.
#
# The point of this file is that the dogfood gate in ci.yml must be able to FAIL.
# Before this repo had a config and committed anchors, `action-smoke` asserted
# `code = CLEAN` against a tree with zero anchors, where CLEAN was the only
# reachable verdict. CLAUDE.md's own rule: if a gate would pass vacuously, it is
# not a gate.
#
# Every provider disabled below fires only on `fixtures/`, which are sample
# applications for the test harness, not this project's surface. keeldocs is a
# CLI: it serves no HTTP endpoints, owns no database, and deploys no services.
# Documenting a fixture's REST API as though it were keeldocs' own would be noise
# scored as coverage - the exact failure this tool exists to argue against. What
# is left is what keeldocs actually has: its own module graph, the env vars it
# reads, its workspace shape, and its decision history.
[providers]
disable = ["aspnet", "django", "fastapi", "gin", "rails", "spring", "express", "nestjs", "supabase-functions", "supabase-postgrest", "drizzle", "prisma", "sql-replay", "sql-policies", "tbls-live", "compose", "helm", "kustomize", "next-routes", "react-router", "vue-router", "angular-router", "go-symbols", "java-symbols", "kafka", "rabbitmq", "redis-pubsub", "sqs-sns", "supabase-realtime"]

# The limitation this file recorded on its first run is closed. `disable` removes
# a whole PROVIDER, which was the wrong shape for the case this repo is in:
# `env-readers` legitimately runs here, and it also read `fixtures/`, so
# docs/reference/configuration.md was accurate and noisy - every row carried a
# true receipt and a third of them pointed at a fixture app rather than at
# keeldocs. The choice was to lose the provider everywhere or to hand-prune a
# generated table, which is exactly the hand-maintenance this tool exists to
# remove.
#
# `exclude-paths` scopes by path instead. It is subtracted in the single repo
# walk (src/scope.js), so an excluded path is invisible to provider detection, to
# `inputs`, and to the sandbox view alike - and, importantly, to the base-commit
# extraction `--since` diffs against, or the exclusion itself would read as drift.
# Any repo with fixtures/, examples/, vendor/ or testdata/ has this problem; it
# was a product gap, not a quirk of this one.
exclude-paths = ["fixtures/**", "experiments/**", "scripts/harness.py"]

# `scripts/harness.py` is in the list for the same reason and is worth naming,
# because it is a FILE rather than a directory and because it is real project
# code: the harness builds fixture repositories inline, so every `process.env.X`
# it writes as test input was extracted and documented as keeldocs' own
# configuration. Six rows of scaffolding - D9_ADDED, D9_PROBE, ITEMS_FLAG and the
# three the path-scope gate itself introduced - sat in
# docs/reference/configuration.md next to the variables the CLI actually reads.
# Every one of them carried a true receipt, which is the point: the receipts were
# never wrong, the SCOPE was.
