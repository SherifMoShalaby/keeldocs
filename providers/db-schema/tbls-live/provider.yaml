id: tbls-live
capability: db-schema
semver: 0.2.1
tier: code            # wraps tbls (wrap-don't-rebuild); catalog-only introspection
confidence: OBSERVED  # ADR-003 as decided: INTROSPECTED is reserved for
                      # REPO-DERIVED instances (sql-replay); an ad-hoc live
                      # environment read is an OBSERVATION. Reclassified when
                      # the replay engine landed (doc 11 R1), resolving the
                      # deviation flagged in the ADR-003 amendment. Identity
                      # handling (declared-beats-live skip) is unchanged.
live: true            # OPT-IN: runs only under --live, never in default or CI checks
entry: ./extract_tbls.py
detect: { always: true }   # gating is the live flag, not detection
inputs: []
requires: ["tbls"]
timeout_class: C
emits: [table, extraction-gap]   # a catalog entry this provider does not model
                                 # (a view) is named rather than dropped in silence
# DSN: env-NAMED via keeldocs.toml [live] dsn-env, resolved by the engine into
# KEELDOCS_DSN, forwarded to tbls as TBLS_DSN - never argv, never in output.
# Declared-beats-live (ADR-005): the engine skips a live table when a declared
# provider already covers it (exact lowercase match, public schema - no guessing).
