id: prisma
capability: db-schema
semver: 0.1.0
tier: code            # schema.prisma is declarative but needs a real parser (attributes,
                      # relations, comments-inside-strings - see E1 finding on // in URLs)
entry: ./prototype/extract_prisma.py
detect: { deps: ["prisma", "@prisma/client"], files: ["schema.prisma"] }
argMode: schemaFile
inputs: ["**/schema.prisma"]
requires: []
timeout_class: D
emits: [table, column, relation, enum]
