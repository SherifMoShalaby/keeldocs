id: prisma
capability: db-schema
semver: 0.1.0
tier: code            # schema.prisma is declarative but needs a real parser (attributes,
                      # relations, comments-inside-strings - see E1 finding on // in URLs)
entry: ./prototype/extract_prisma.py
detect: { deps: ["prisma", "@prisma/client"], files: ["schema.prisma"] }
argMode: schemaFile
inputs: ["**/schema.prisma"]
requires: []
timeout_class: D
emits: [table, enum]   # columns and relations are ATTRIBUTES of a table fact, not
                       # fact types. This line said [table, column, relation, enum]
                       # from v0.1 until the day `emits` became enforceable, and it
                       # was printed verbatim in the consent manifest.
