id: env-readers
capability: config-surface
semver: 0.1.0
tier: code            # value-blind by construction: the output schema has no value
entry: ./extract_env.py
detect: { always: true }
inputs: ["**/*.{js,mjs,cjs,ts,tsx,jsx,prisma}", ".env.example", ".env.schema", ".env.sample"]
requires: []
timeout_class: D
emits: [env-var]
