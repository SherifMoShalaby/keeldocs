id: express
capability: http-endpoints
semver: 0.1.0
tier: code            # dynamic registration (app.use mount chains) is invisible to
                      # single-tree queries: E1 measured naive declarative at 5% recall
                      # on a router-structured app vs 100% for this mount-graph resolver.
entry: ./prototype/extract_express.py   # working prototype; engine port pending
detect: { deps: ["express"] }
inputs: ["**/*.{ts,js,mjs}"]   # the extractor walks the WHOLE tree for .ts/.js - a root-anchored src/** would have hidden every package in a monorepo
requires: []
timeout_class: C
emits: [endpoint, extraction-gap]
incremental: per-file   # D6: scanning is per-file; the mount graph below still resolves over the whole set
