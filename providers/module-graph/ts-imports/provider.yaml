id: ts-imports
capability: module-graph
semver: 0.2.0
tier: code            # tree-sitter parse; E2/E3-validated signature normalization
entry: ./extract_symbols.py
detect: { always: true }   # TS/ESM surface may exist in any repo; zero files = zero facts
needs: ["workspace-layout"]   # symbol IDs take their package segment from workspace facts (ADR-007)
inputs: ["${facts:workspace-layout}", "**/*.{ts,tsx,js,mjs}"]   # declared cross-capability read (contract 9)
requires: ["tree-sitter", "tree-sitter-typescript"]
timeout_class: D
emits: [module, symbol]   # symbols carry ADR-007 `ds` identities; modules carry import edges
# Honest scope (v0.1): ESM/TS only - CommonJS module.exports is not modeled.
# Overload implementation signatures are excluded from the fact hash
# (ADR-007 amendment 3); bodies are never part of any signature.
incremental: per-file   # D4: parsing is per-file; resolution below still runs over the whole set
