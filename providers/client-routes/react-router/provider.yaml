id: react-router
capability: client-routes
semver: 0.3.0
tier: code            # tier by shape, not preference (the E1/E14 method):
                      # react-router routes live in NESTED JSX trees and in
                      # createBrowserRouter/useRoutes object literals - path
                      # composition across nesting, which a single-tree query
                      # cannot do. Owner-requested capability (2026-08-01) for
                      # React/Capacitor apps: inventory the app's screens and
                      # drift-check them. Route facts are EXCLUDED from the
                      # coverage denominator (owner decision: endpoints/
                      # tables/env/services); bindable via fact:client-routes/*.
                      # Fixture-validated both idioms; field recall probe rides
                      # E9 (owner-side). No renderer yet - anchors bind manually.
entry: ./extract_routes.py
detect: { deps: ["react-router-dom", "react-router", "@tanstack/react-router"] }
inputs: ["**/*.{tsx,jsx,ts,js}"]   # the extractor walks the whole tree; a root-anchored src/** hid every package in a monorepo
requires: ["tree-sitter", "tree-sitter-typescript"]
timeout_class: C
emits: [route, extraction-gap]
