# Publish to npm with provenance on version tags (v0.1.0, v0.2.0-rc.1, ...).
#
# Auth is npm Trusted Publishing (OIDC): configure this repo + this workflow
# FILENAME at npmjs.com/package/keeldocs/access. No NPM_TOKEN, no secret in the
# repo - a stored publish token is precisely what R9 (supply-chain compromise of
# the tool itself) is about.
#
# The full test suite gates the publish - a red harness cannot ship.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance attestation via OIDC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12" }
      # Trusted publishing needs npm >= 11.5.1; Node 20 bundles 10.x. `npm@latest`
      # does NOT work here - npm 12 declares node ^22.22.2 || ^24.15.0 || >=26,
      # so it dies EBADENGINE before doing anything (measured, 2026-08-03). Pin
      # the newest major that runs on the Node this job tests with, and assert the
      # floor so a future engine bump fails HERE, loudly, instead of at publish.
      - name: npm new enough for trusted publishing
        run: |
          npm install -g npm@11
          v=$(npm --version); req=11.5.1
          echo "npm $v on node $(node --version)"
          test "$(printf '%s\n%s\n' "$req" "$v" | sort -V | head -1)" = "$req" \
            || { echo "npm $v < $req - trusted publishing would fail at the publish step"; exit 1; }
      - name: Install extractor runtime (pinned)
        run: pip install --require-hashes -r providers/requirements.txt
      # ci.yml has always done this and release.yml never did, so the suite that
      # gates the publish was a WEAKER suite than the one that gates a push:
      # sql-replay needs pglite, an optionalDependency, and 7 checks fail without
      # it. The gate must be the same gate or it is not a gate.
      - name: Install engine runtime (pglite for sql-replay, lockfile-pinned)
        run: npm ci --no-fund --no-audit
      - name: Full suite
        run: npm test
      - name: Tag must match package.json version
        run: |
          v=$(node -p 'require("./package.json").version')
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package version $v"; exit 1; }
      # npm REFUSES to publish a prerelease without an explicit --tag, so derive
      # it from the version: 0.2.0-rc.1 -> rc, 0.3.0-beta.2 -> beta, 1.0.0 -> latest.
      # Publishing a prerelease must never move `latest` on its own.
      - name: Publish (provenance via OIDC, no token)
        run: |
          v=$(node -p 'require("./package.json").version')
          case "$v" in
            *-*) tag=$(printf '%s' "${v#*-}" | cut -d. -f1) ;;
            *)   tag=latest ;;
          esac
          echo "publishing $v with dist-tag $tag"
          npm publish --provenance --access public --tag "$tag"
