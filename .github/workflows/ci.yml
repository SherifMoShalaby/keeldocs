name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  # Cross-OS determinism matrix (ADR-003's tested invariant): the SAME goldens
  # must reproduce byte-identically on every OS, and the harness double-runs
  # every extractor. Windows went GREEN 2026-07-31 (posix-emit contract +
  # fileURLToPath roots + LF-pinned harness) but stays non-blocking per the
  # reduced-trust owner decision (2026-07-30): its guarantee tier is weaker
  # (sandboxing), so it reports rather than gates. Promote by deleting the
  # continue-on-error line.
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 20 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12" }
      - name: Install extractor runtime (pinned)
        run: pip install --require-hashes -r providers/requirements.txt
      - name: Install engine runtime (pglite for sql-replay, lockfile-pinned)
        run: npm ci --no-fund --no-audit
      - name: Engine unit tests + fixture matrix (captured)
        run: |
          set +e
          # `python`, not `python3`: setup-python guarantees the former on all
          # three OS; Windows runners have no python3 shim in git-bash
          { node --test tests/*.test.js && python scripts/harness.py; } 2>&1 | tee "$RUNNER_TEMP/harness.log"
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### harness (${{ matrix.os }}) rc=$rc"
            echo "- node $(node --version) / $(python --version) / $(git --version)"
            echo '```'
            tail -60 "$RUNNER_TEMP/harness.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
  # npm packaging must stay publish-ready: pack the tarball, install it into a
  # clean consumer, run the bin. Publishing itself happens in release.yml.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 20 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12" }
      - name: Install extractor runtime (pinned)
        # the packed CLI's real requirement - without it every provider fails
        # and check now honestly exits 2 (it used to lie CLEAN; the fail-closed
        # fix in 850a7aa exposed this job as under-provisioned)
        run: pip install -q --require-hashes -r providers/requirements.txt
      - name: Pack and consume the tarball
        run: |
          npm pack
          mkdir /tmp/consume && cd /tmp/consume && npm init -y > /dev/null
          npm install --no-fund --no-audit "$GITHUB_WORKSPACE"/keeldocs-*.tgz
          npx keeldocs --version
          npx keeldocs check --json > /dev/null || test $? -le 1

  # Dogfood the composite action against this repo - it must come back CLEAN.
  action-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run keeldocs action on this repo
        id: kd
        uses: ./
        with: { comment: "false" }
      - name: Assert clean
        run: test "${{ steps.kd.outputs.code }}" = "CLEAN"
      # CLEAN alone is not a gate. Until this repo carried a keeldocs.toml and
      # committed anchors, CLEAN was the ONLY reachable verdict here - zero
      # anchors cannot drift - so this job passed for months while proving
      # nothing. Assert that the run actually bound something, or the next time
      # the anchors vanish the gate goes quiet instead of red.
      - name: Assert the dogfood is not vacuous
        run: |
          set -euo pipefail
          f=$(ls -t .keeldocs/out/check-*.json | head -1)
          python - "$f" <<'PY'
          import json, sys
          cov = json.load(open(sys.argv[1]))["coverage"]
          documented, total = cov["documented"], cov["total"]
          assert total > 0, "keeldocs found no surfaces in its own repo - config or providers broke"
          assert documented > 0, f"CLEAN with 0/{total} documented: nothing is anchored, so CLEAN is vacuous"
          print(f"dogfood is real: {documented}/{total} surfaces documented")
          PY
      - name: Rollup dry-run smoke (clean repo -> nothing to sync, nothing written)
        id: rollup
        uses: ./rollup
        with: { dry-run: "true" }
      # `applied = 0` was the other half of this assertion and could not fail,
      # fifteen lines below the comment above. On a clean tree `sync` applies
      # nothing under EITHER branch of the rollup - the dry-run branch has no
      # `--apply-all`, and `--apply-all` with nothing to do applies nothing
      # either - so it compared 0 with 0 no matter what the action did. What it
      # was standing in for, that the push step's `applied != '0'` guard sees
      # the regenerations the engine applied, needs a tree with something to
      # apply; that gate is in scripts/harness.py ("rollup push decision"),
      # which runs both branches over real drift with the action's own
      # expressions. What CI can still prove is here, and it is not entailed by
      # the CLEAN above: a preview wrote nothing to a file under version
      # control. Today only the untracked kd-sync.json appears; a `sync` that
      # started writing during a dry run would turn this red.
      - name: Assert the rollup preview reported, and wrote, nothing
        run: |
          set -euo pipefail
          test "${{ steps.rollup.outputs.code }}" = "NOTHING_TO_SYNC"
          git diff --quiet HEAD || {
            echo "the rollup PREVIEW modified tracked file(s):"
            git diff --name-only HEAD
            exit 1
          }
