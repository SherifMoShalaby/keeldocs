name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  # Cross-OS determinism matrix (ADR-003's tested invariant): the SAME goldens
  # must reproduce byte-identically on every OS, and the harness double-runs
  # every extractor. Windows is the reduced-trust tier (owner decision
  # 2026-07-30): it runs, its result is reported, it cannot block a release.
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    permissions: { contents: write } # debug-branch publishing on failure, below
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install extractor runtime (pinned)
        run: pip install -r providers/requirements.txt
      - name: Engine unit tests
        run: node --test tests/*.test.js
      - name: Fixture matrix + integrations + determinism double-runs
        run: |
          set +e
          python3 scripts/harness.py 2>&1 | tee /tmp/harness.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### harness (${{ matrix.os }}) rc=$rc"
            echo "- node $(node --version) / $(python3 --version) / $(git --version)"
            echo '```'
            tail -60 /tmp/harness.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Publish failure log to a debug branch
        if: failure()
        run: |
          d="$RUNNER_TEMP/kd-debug" && rm -rf "$d" && mkdir -p "$d"
          python3 providers/http-endpoints/express/prototype/extract_express.py fixtures/express-mounts > "$d/express-out.json" 2> "$d/express-err.txt" || true
          ( cd fixtures/express-mounts && find . -type f ! -path "./.keeldocs/*" -exec sha256sum {} \; | sort ) > "$d/fixture-hashes.txt"
          python3 -c "import tree_sitter, tree_sitter_javascript as j, tree_sitter_typescript as t; print(tree_sitter.__file__); print(j.__file__); print(t.__file__)" > "$d/modpaths.txt" 2>&1 || true
          cd "$d"
          cp /tmp/harness.log harness.log || echo "(no log captured)" > harness.log
          { node --version; python3 --version; git --version; pip freeze | grep -Ei "tree|yaml" ; } > toolchain.txt 2>&1
          git init -q
          git checkout -qb "ci-debug-${{ github.run_number }}-${{ matrix.os }}"
          git add -A
          git -c user.name=keeldocs-ci -c user.email=ci@invalid commit -qm "harness failure log (${{ matrix.os }})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD

  # npm packaging must stay publish-ready: pack the tarball, install it into a
  # clean consumer, run the bin. Publishing itself happens in release.yml.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Pack and consume the tarball
        run: |
          npm pack
          mkdir /tmp/consume && cd /tmp/consume && npm init -y > /dev/null
          npm install --no-fund --no-audit "$GITHUB_WORKSPACE"/keeldocs-*.tgz
          npx keeldocs --version
          npx keeldocs check --json > /dev/null || test $? -le 1

  # Dogfood the composite action against this repo - it must come back CLEAN.
  action-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run keeldocs action on this repo
        id: kd
        uses: ./
        with: { comment: "false" }
      - name: Assert clean
        run: test "${{ steps.kd.outputs.code }}" = "CLEAN"
