name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  # Cross-OS determinism matrix (ADR-003's tested invariant): the SAME goldens
  # must reproduce byte-identically on every OS, and the harness double-runs
  # every extractor. Windows is the reduced-trust tier (owner decision
  # 2026-07-30): it runs, its result is reported, it cannot block a release.
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    permissions: { contents: read }
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install extractor runtime (pinned)
        run: pip install -r providers/requirements.txt
      - name: Engine unit tests
        run: node --test tests/*.test.js
      - name: Fixture matrix + integrations + determinism double-runs
        run: |
          set +e
          python3 scripts/harness.py 2>&1 | tee /tmp/harness.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### harness (${{ matrix.os }}) rc=$rc"
            echo "- node $(node --version) / $(python3 --version) / $(git --version)"
            echo '```'
            tail -60 /tmp/harness.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # npm packaging must stay publish-ready: pack the tarball, install it into a
  # clean consumer, run the bin. Publishing itself happens in release.yml.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install extractor runtime (pinned)
        # the packed CLI's real requirement - without it every provider fails
        # and check now honestly exits 2 (it used to lie CLEAN; the fail-closed
        # fix in 850a7aa exposed this job as under-provisioned)
        run: pip install -q -r providers/requirements.txt
      - name: Pack and consume the tarball
        run: |
          npm pack
          mkdir /tmp/consume && cd /tmp/consume && npm init -y > /dev/null
          npm install --no-fund --no-audit "$GITHUB_WORKSPACE"/keeldocs-*.tgz
          npx keeldocs --version
          npx keeldocs check --json > /dev/null || test $? -le 1

  # Dogfood the composite action against this repo - it must come back CLEAN.
  action-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run keeldocs action on this repo
        id: kd
        uses: ./
        with: { comment: "false" }
      - name: Assert clean
        run: test "${{ steps.kd.outputs.code }}" = "CLEAN"
      - name: Rollup dry-run smoke (clean repo -> nothing to sync, nothing pushed)
        id: rollup
        uses: ./rollup
        with: { dry-run: "true" }
      - name: Assert rollup no-op
        run: test "${{ steps.rollup.outputs.code }}" = "NOTHING_TO_SYNC" -a "${{ steps.rollup.outputs.applied }}" = "0"
